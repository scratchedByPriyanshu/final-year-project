# Civic Connect Application Properties
spring.application.name=civic-connect
server.port=8080

# Primary H2 In-Memory Database (MySQL Compatibility Mode - Ideal for Git Repositories & Demos)
spring.datasource.url=jdbc:h2:mem:civic_connect_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration for H2 / MySQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable SQL script initialization from schema.sql and data.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT Security Configurations
civicconnect.app.jwtSecret=9a2f8c4e7b1a3d5e8f0b2c4a6e8d1f3b5a7c9e2d4f6a8b0c2e4f6a8b0c2e4f6a
civicconnect.app.jwtExpirationMs=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

